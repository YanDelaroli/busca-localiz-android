name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Testar, analisar e montar APK
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Publicar somente a versão com pesquisa interna
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -z "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY não configurada: nenhum APK será publicado."
            gh release delete v1.0.0-teste --cleanup-tag --yes 2>/dev/null || true
            exit 0
          fi

          cp app/build/outputs/apk/debug/app-debug.apk Busca-Local-v1.0.0-teste.apk
          gh release create v1.0.0-teste Busca-Local-v1.0.0-teste.apk \
            --target "$GITHUB_SHA" \
            --title "Busca Local v1.0.0 — teste" \
            --notes "APK instalável com pesquisa e resultados exibidos inteiramente dentro do Busca Local."
