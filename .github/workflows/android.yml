name: Android CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Testar, analisar e montar APK
        env:
          MAPS_API_KEY: ""
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Preparar APK para download
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cp app/build/outputs/apk/debug/app-debug.apk Busca-Local-v1.0.0-teste.apk

      - name: Publicar APK de teste
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0-teste >/dev/null 2>&1; then
            gh release upload v1.0.0-teste Busca-Local-v1.0.0-teste.apk --clobber
          else
            gh release create v1.0.0-teste Busca-Local-v1.0.0-teste.apk \
              --target "$GITHUB_SHA" \
              --title "Busca Local v1.0.0 — teste" \
              --notes "APK instalável para testar o Busca Local. No modo sem chave, as consultas são abertas diretamente no Google Maps."
          fi
